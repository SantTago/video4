<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vídeo Responsivo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .video-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .video-container video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <video controls playsinline>
      <source src="meu-video.mp4" type="video/mp4">
      Seu navegador não suporta vídeos.
    </video>
  </div>

</body>
</html>
