<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Vídeo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-container {
      position: relative;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
      overflow: hidden;
    }

    video {
      display: block;

      width: auto;
      height: 100%;

      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;

      object-fit: contain;

      background: #000;
    }

    /* PLAY CENTRAL */
    .play-button {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 82px;
      height: 82px;

      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, 0.45);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      cursor: pointer;

      z-index: 20;

      transition:
        opacity 0.25s ease,
        transform 0.25s ease;
    }

    .play-button::after {
      content: "";

      margin-left: 6px;

      width: 0;
      height: 0;

      border-top: 14px solid transparent;
      border-bottom: 14px solid transparent;
      border-left: 22px solid #fff;
    }

    .play-button:hover {
      transform:
        translate(-50%, -50%)
        scale(1.08);
    }

    .play-button.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* BARRA DE PROGRESSO */
    .progress-container {
      position: absolute;

      left: 20px;
      right: 20px;
      bottom: 18px;

      height: 6px;

      background: rgba(255, 255, 255, 0.25);

      border-radius: 100px;

      overflow: hidden;

      cursor: pointer;

      z-index: 15;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background: linear-gradient(
        90deg,
        #00c6ff,
        #7b61ff,
        #ff4fa3
      );

      border-radius: 100px;

      box-shadow:
        0 0 8px rgba(123, 97, 255, 0.8),
        0 0 14px rgba(255, 79, 163, 0.5);
    }

    /* CELULAR */
    @media (max-width: 768px) {

      video {
        width: 100vw;
        height: 100vh;
        height: 100dvh;

        object-fit: contain;
      }

      .progress-container {
        left: 15px;
        right: 15px;
        bottom: calc(14px + env(safe-area-inset-bottom));

        height: 5px;
      }

      .play-button {
        width: 78px;
        height: 78px;
      }
    }

    /* COMPUTADOR */
    @media (min-width: 769px) {

      video {
        width: auto;
        height: 100vh;

        max-width: 100vw;

        object-fit: contain;
      }

      .progress-container {
        width: calc(100% - 40px);
        max-width: 500px;

        left: 50%;

        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

  <div class="video-container">

    <video
      id="videoPrincipal"
      playsinline
      webkit-playsinline
      preload="auto"
    >

      <source
        src="meu-video.mp4"
        type="video/mp4"
      >

      Seu navegador não suporta este vídeo.

    </video>


    <button
      id="playButton"
      class="play-button"
      type="button"
      aria-label="Reproduzir vídeo"
    ></button>


    <div
      class="progress-container"
      id="progressContainer"
    >

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

  </div>


  <script>

    const video =
      document.getElementById("videoPrincipal");

    const playButton =
      document.getElementById("playButton");

    const progressContainer =
      document.getElementById("progressContainer");

    const progressBar =
      document.getElementById("progressBar");


    /*
    =========================
    PLAY + ÁUDIO
    =========================
    */

    async function iniciarVideo() {

      try {

        /* ATIVA O SOM ANTES DO PLAY */
        video.muted = false;
        video.volume = 1;

        /* INICIA O VÍDEO */
        await video.play();

        /* ESCONDE O PLAY */
        playButton.classList.add("hide");

      } catch (erro) {

        console.log(
          "Erro ao reproduzir vídeo:",
          erro
        );

      }

    }


    playButton.addEventListener(
      "click",
      iniciarVideo
    );


    /*
    =========================
    BARRA DE PROGRESSO
    =========================
    */

    video.addEventListener(
      "timeupdate",
      function () {

        if (!video.duration) return;

        const porcentagem =
          (
            video.currentTime /
            video.duration
          ) * 100;

        progressBar.style.width =
          porcentagem + "%";

      }
    );


    /*
    =========================
    AVANÇAR / VOLTAR
    =========================
    */

    progressContainer.addEventListener(
      "click",
      function (event) {

        if (!video.duration) return;

        const rect =
          progressContainer.getBoundingClientRect();

        const posicao =
          event.clientX - rect.left;

        const porcentagem =
          Math.min(
            Math.max(
              posicao / rect.width,
              0
            ),
            1
          );

        video.currentTime =
          porcentagem *
          video.duration;

      }
    );


    /*
    =========================
    PAUSAR TOCANDO NO VÍDEO
    =========================
    */

    video.addEventListener(
      "click",
      function () {

        if (video.paused) {

          video.muted = false;
          video.volume = 1;

          video.play();

          playButton.classList.add("hide");

        } else {

          video.pause();

          playButton.classList.remove("hide");

        }

      }
    );


    /*
    =========================
    QUANDO TERMINAR
    =========================
    */

    video.addEventListener(
      "ended",
      function () {

        playButton.classList.remove("hide");

        progressBar.style.width = "0%";

      }
    );

  </script>

</body>
</html>
