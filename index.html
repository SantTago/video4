<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Vídeo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-container {
      position: relative;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;
      overflow: hidden;
    }

    video {
      display: block;

      width: auto;
      height: 100%;

      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;

      object-fit: contain;

      background: #000;
    }

    /* BOTÃO PARA ATIVAR SOM */
    .sound-button {
      position: absolute;

      top: 25px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 20;

      border: 0;

      padding: 12px 20px;

      border-radius: 50px;

      color: #fff;

      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;

      background: linear-gradient(
        90deg,
        #00c6ff,
        #7b61ff,
        #ff4fa3
      );

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.35);

      cursor: pointer;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease;
    }

    .sound-button.hide {
      opacity: 0;
      pointer-events: none;

      transform:
        translateX(-50%)
        translateY(-10px);
    }

    /* BARRA DE PROGRESSO */
    .progress-container {
      position: absolute;

      left: 20px;
      right: 20px;
      bottom: 18px;

      height: 6px;

      background: rgba(255, 255, 255, 0.25);

      border-radius: 100px;

      overflow: hidden;

      cursor: pointer;

      z-index: 10;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background: linear-gradient(
        90deg,
        #00c6ff,
        #7b61ff,
        #ff4fa3
      );

      border-radius: 100px;

      box-shadow:
        0 0 8px rgba(123, 97, 255, 0.8),
        0 0 14px rgba(255, 79, 163, 0.5);
    }

    /* CELULAR */
    @media (max-width: 768px) {

      video {
        width: 100vw;
        height: 100vh;
        height: 100dvh;

        object-fit: contain;
      }

      .progress-container {
        left: 15px;
        right: 15px;
        bottom: 14px;

        height: 5px;
      }

      .sound-button {
        top: calc(20px + env(safe-area-inset-top));

        font-size: 13px;

        padding: 11px 18px;
      }
    }

    /* COMPUTADOR */
    @media (min-width: 769px) {

      video {
        width: auto;
        height: 100vh;

        max-width: 100vw;

        object-fit: contain;
      }

      .progress-container {
        max-width: 500px;

        width: calc(100% - 40px);

        left: 50%;

        transform: translateX(-50%);
      }
    }
  </style>
</head>

<body>

  <div class="video-container">

    <video
      id="videoPrincipal"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    >

      <source
        src="meu-video.mp4"
        type="video/mp4"
      >

      Seu navegador não suporta este vídeo.

    </video>


    <button
      class="sound-button"
      id="soundButton"
      type="button"
    >
      🔊 Toque para ativar o som
    </button>


    <div
      class="progress-container"
      id="progressContainer"
    >

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

  </div>


  <script>

    const video =
      document.getElementById("videoPrincipal");

    const soundButton =
      document.getElementById("soundButton");

    const progressContainer =
      document.getElementById("progressContainer");

    const progressBar =
      document.getElementById("progressBar");


    /*
    ==========================
    AUTOPLAY
    ==========================
    */

    async function iniciarVideo() {

      video.muted = true;

      try {

        await video.play();

      } catch (erro) {

        console.log(
          "Autoplay bloqueado:",
          erro
        );

      }

    }


    window.addEventListener(
      "load",
      iniciarVideo
    );


    /*
    ==========================
    ATIVAR SOM
    ==========================
    */

    async function ativarSom() {

      try {

        video.muted = false;

        video.volume = 1;

        await video.play();

        soundButton.classList.add("hide");

      } catch (erro) {

        console.log(
          "Não foi possível ativar o áudio:",
          erro
        );

      }

    }


    soundButton.addEventListener(
      "click",
      ativarSom
    );


    soundButton.addEventListener(
      "touchend",
      function (event) {

        event.preventDefault();

        ativarSom();

      },
      {
        passive: false
      }
    );


    /*
    ==========================
    PROGRESSO DO VÍDEO
    ==========================
    */

    video.addEventListener(
      "timeupdate",
      function () {

        if (video.duration) {

          const porcentagem =
            (
              video.currentTime /
              video.duration
            ) * 100;

          progressBar.style.width =
            porcentagem + "%";

        }

      }
    );


    /*
    ==========================
    AVANÇAR / VOLTAR
    ==========================
    */

    function alterarTempo(event) {

      const rect =
        progressContainer.getBoundingClientRect();

      let posicao;

      if (event.touches) {

        posicao =
          event.touches[0].clientX -
          rect.left;

      } else {

        posicao =
          event.clientX -
          rect.left;

      }

      const porcentagem =
        Math.min(
          Math.max(
            posicao / rect.width,
            0
          ),
          1
        );

      video.currentTime =
        porcentagem *
        video.duration;

    }


    progressContainer.addEventListener(
      "click",
      alterarTempo
    );


    /*
    ==========================
    PLAY / PAUSE
    ==========================
    */

    video.addEventListener(
      "click",
      function () {

        if (video.paused) {

          video.play();

        } else {

          video.pause();

        }

      }
    );

  </script>

</body>
</html>
