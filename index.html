<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Vídeo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .video-container {
      position: relative;

      width: 100vw;
      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;
      overflow: hidden;
    }

    video {
      display: block;

      width: auto;
      height: 100%;

      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;

      object-fit: contain;

      background: #000;
    }

    /* BARRA PERSONALIZADA */
    .progress-container {
      position: absolute;

      left: 20px;
      right: 20px;
      bottom: 18px;

      height: 6px;

      background: rgba(255, 255, 255, 0.25);

      border-radius: 100px;

      overflow: hidden;

      cursor: pointer;

      z-index: 10;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      background: linear-gradient(
        90deg,
        #00c6ff,
        #7b61ff,
        #ff4fa3
      );

      border-radius: 100px;

      transition: width 0.1s linear;

      box-shadow:
        0 0 8px rgba(123, 97, 255, 0.8),
        0 0 14px rgba(255, 79, 163, 0.5);
    }

    /* CELULAR */
    @media (max-width: 768px) {

      video {
        width: 100vw;
        height: 100vh;
        height: 100dvh;

        object-fit: contain;
      }

      .progress-container {
        left: 15px;
        right: 15px;
        bottom: 12px;

        height: 5px;
      }
    }

    /* COMPUTADOR */
    @media (min-width: 769px) {

      video {
        width: auto;
        height: 100vh;

        max-width: 100vw;

        object-fit: contain;
      }

      .progress-container {
        max-width: 500px;

        left: 50%;

        transform: translateX(-50%);

        width: calc(100% - 40px);
      }
    }
  </style>
</head>

<body>

  <div class="video-container">

    <video
      id="videoPrincipal"
      autoplay
      muted
      playsinline
      preload="auto"
    >

      <source src="meu-video.mp4" type="video/mp4">

      Seu navegador não suporta este vídeo.

    </video>


    <div
      class="progress-container"
      id="progressContainer"
    >

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

  </div>


  <script>

    const video =
      document.getElementById("videoPrincipal");

    const progressContainer =
      document.getElementById("progressContainer");

    const progressBar =
      document.getElementById("progressBar");


    /* AUTOPLAY */

    window.addEventListener("load", function () {

      video.muted = true;

      video.play().catch(function (erro) {

        console.log(
          "Autoplay bloqueado:",
          erro
        );

      });

    });


    /* ATUALIZA A BARRA */

    video.addEventListener(
      "timeupdate",
      function () {

        if (video.duration) {

          const porcentagem =
            (video.currentTime / video.duration) * 100;

          progressBar.style.width =
            porcentagem + "%";

        }

      }
    );


    /* CLICAR NA BARRA PARA AVANÇAR */

    progressContainer.addEventListener(
      "click",
      function (event) {

        const largura =
          progressContainer.clientWidth;

        const clique =
          event.offsetX;

        const porcentagem =
          clique / largura;

        video.currentTime =
          porcentagem * video.duration;

      }
    );


    /* CLICAR NO VÍDEO = PAUSE / PLAY */

    video.addEventListener(
      "click",
      function () {

        if (video.paused) {

          video.play();

        } else {

          video.pause();

        }

      }
    );

  </script>

</body>
</html>
